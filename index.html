<script>
  /* Captura de erro no nível da página inteira — o LimiteDeErro (dentro do React) só pega erro
     que acontece DURANTE a renderização. Isso aqui pega o que ele não alcança: erro no
     carregamento/execução de um dos arquivos .js, ou erro assíncrono (dentro de uma promise) que
     nunca chega a entrar no ciclo do React. Sem isso, esses casos caem em tela branca sem pista
     nenhuma de por quê. */
  function mostrarErroDePagina(titulo, detalhe, pilha) {
    var raiz = document.getElementById("root");
    if (!raiz) return;
    raiz.innerHTML =
      '<div style="padding:20px;font-family:monospace;background:#fff;color:#111;min-height:100vh;box-sizing:border-box;">' +
      '<h2 style="color:#b91c1c;margin-bottom:8px;">⚠️ ' + titulo + '</h2>' +
      '<p style="font-weight:bold;margin-bottom:12px;white-space:pre-wrap;">' + String(detalhe || "erro desconhecido") + '</p>' +
      (pilha ? '<pre style="font-size:11px;white-space:pre-wrap;background:#f5f5f4;padding:10px;border-radius:8px;">' + String(pilha) + '</pre>' : "") +
      '<button onclick="window.location.reload()" style="margin-top:16px;padding:10px 16px;background:#065f46;color:#fff;border:none;border-radius:8px;font-weight:bold;">Recarregar</button>' +
      '</div>';
  }
  window.addEventListener("error", function (evento) {
    mostrarErroDePagina(
      "Erro ao carregar/executar",
      (evento.message || "erro sem mensagem") + "\n(arquivo: " + (evento.filename || "?") + ", linha " + (evento.lineno || "?") + ")",
      evento.error && evento.error.stack
    );
  });
  window.addEventListener("unhandledrejection", function (evento) {
    mostrarErroDePagina("Promessa rejeitada sem tratamento", evento.reason && evento.reason.message ? evento.reason.message : String(evento.reason), evento.reason && evento.reason.stack);
  });
</script>

<script>
  window.VERSAO_APP = "2026.09.03-7"; // fonte única da versão — muda só aqui a cada entrega, um arquivo só
</script>

<script>
  /* Busca ATIVA de verdade: busca o PRÓPRIO index.html direto do servidor, com cache totalmente
     desligado, e lê a versão de dentro dele — sem precisar de nenhum arquivo separado, só o
     index.html mesmo (que já é o único que muda a cada entrega). Se a versão de lá for diferente
     da que está rodando agora, recarrega sozinho na hora — não depende só do mecanismo do service
     worker (mais indireto, e que já causou confusão antes). A tela de carregamento espera essa
     checagem (ou 2,5s, o que vier primeiro) antes de mostrar a lista, e ela roda de novo a cada
     60s enquanto o app fica aberto. */
  window.__promessaVerificacaoAtualizacao = new Promise((resolve) => {
    let resolvido = false;
    function resolverUmaVez() { if (!resolvido) { resolvido = true; resolve(); } }
    setTimeout(resolverUmaVez, 2500);

    async function buscarVersaoAtiva() {
      try {
        const resposta = await fetch("./index.html?t=" + Date.now(), { cache: "no-store" });
        const texto = await resposta.text();
        const encontrado = texto.match(/VERSAO_APP\s*=\s*"([^"]+)"/);
        const versaoServidor = encontrado ? encontrado[1] : null;
        if (versaoServidor && versaoServidor !== window.VERSAO_APP) {
          window.location.reload(); // versão nova de verdade no servidor — recarrega na hora
          return; // nunca resolve — a página está saindo daqui mesmo
        }
      } catch (e) { /* rede falhou ou offline — segue sem travar o app */ }
      resolverUmaVez();
    }
    buscarVersaoAtiva();
    setInterval(buscarVersaoAtiva, 60 * 1000);

    if (!("serviceWorker" in navigator)) return;
    navigator.serviceWorker.register("./service-worker.js", { updateViaCache: "none" }).then((reg) => {
      /* Seção 33.1 do mapa: reg.update() sem .catch() — se falhar (rede instável, aba em segundo
         plano no Android, algo passageiro), virava promessa rejeitada sem tratamento e disparava
         a tela de erro à toa, mesmo o app não tendo quebrado de verdade. Não-crítico: loga e segue. */
      reg.update().catch((e) => console.warn("Checagem de atualização falhou (não crítico):", e));
      setInterval(() => reg.update().catch((e) => console.warn("Checagem de atualização falhou (não crítico):", e)), 60 * 1000);

      reg.addEventListener("updatefound", () => {
        const novoSW = reg.installing;
        if (!novoSW) return;
        novoSW.addEventListener("statechange", () => {
          if (novoSW.state === "installed" && navigator.serviceWorker.controller) {
            novoSW.postMessage("SKIP_WAITING");
          }
        });
      });
      let jaRecarregou = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (jaRecarregou) return;
        jaRecarregou = true;
        window.location.reload();
      });
    }).catch(() => {});
  });
</script>

<script type="text/babel" data-presets="react,env">
const { useState, useEffect, useRef } = React;

/* Versão do app — fonte única é window.VERSAO_APP, definida no script antes deste. Só precisa
   mudar em um lugar (aquele script) a cada entrega — não existe mais arquivo separado de versão. */
const VERSAO_APP = window.VERSAO_APP || "?";

/* =========================================================
   HELPERS GERAIS
========================================================= */
const uid = () =>
  crypto.randomUUID ? crypto.randomUUID() : "id_" + Math.random().toString(36).slice(2) + Date.now();

const by = (arr, id) => (arr || []).find((x) => x.id === id);

const brl = (v) =>
  v == null || isNaN(v) ? "—" : v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

const numDe = (txt) => {
  if (txt == null || txt === "") return null;
  const v = parseFloat(String(txt).replace(",", "."));
  return isNaN(v) ? null : v;
};

/* Entrada inteligente de preço: sem vírgula/ponto -> últimos 2 dígitos viram centavos
   (até 2 dígitos = reais inteiros). Com vírgula/ponto -> valor literal. */
const parsePrecoInteligente = (txt) => {
  if (txt == null) return null;
  const t = String(txt).trim();
  if (t === "") return null;
  if (t.includes(",") || t.includes(".")) {
    const v = parseFloat(t.replace(",", "."));
    return isNaN(v) ? null : v;
  }
  const digitos = t.replace(/\D/g, "");
  if (!digitos) return null;
  if (digitos.length <= 2) return parseInt(digitos, 10);
  const centavos = digitos.slice(-2);
  const reais = digitos.slice(0, -2);
  return parseInt(reais, 10) + parseInt(centavos, 10) / 100;
};
const formatarValorCampo = (v) => (v == null ? "" : v.toFixed(2).replace(".", ","));
/* Bug 22.5.2: filtra o que é digitado nos campos de preço pra só aceitar dígito/vírgula/ponto */
const sanitizarEntradaPreco = (txt) => (txt || "").replace(/[^0-9,.]/g, "");

function diasDesde(dataStr) {
  const d = Math.floor((Date.now() - new Date(dataStr).getTime()) / 86400000);
  if (d <= 0) return "hoje";
  if (d === 1) return "há 1 dia";
  return `há ${d} dias`;
}
function dataCurta(dataStr) {
  return new Date(dataStr).toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
}
/* Versão compacta pra caber como rótulo dentro do gráfico, ao lado de cada ponto */
function dataCompacta(dataStr) {
  const d = new Date(dataStr);
  return `${d.getDate()}/${d.getMonth() + 1}`;
}
function mesAno(dataStr) {
  const d = new Date(dataStr);
  const s = d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function dataParaArquivo() {
  return new Date().toISOString().slice(0, 10);
}
function normalizar(txt) {
  return (txt || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}
function resizeImage(file, maxWidth = 480, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* Compartilhada entre Mercado e Finanças — monta uma versão limpa em HTML a partir de qualquer
   fonte já lida (PDF, texto colado, foto+OCR). Cada campo é opcional, o HTML só mostra o que
   existe — funciona tanto pra nota com itens quanto pra comprovante só com total. Documento
   autocontido (CSS embutido, sem CDN), pensado pra abrir numa aba nova mesmo offline. Isso é só
   a "embalagem" visual — nunca é a fonte de verdade dos dados (isso continua sendo o arquivo
   original, guardado à parte); ver abrirArquivoDocumento (financas.js) pra como os dois convivem. */
function escaparHtml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function montarHtmlRecibo({ nomeEmit, cnpj, dataEmissao, valorTotal, itens, formaPagamento, chaveAcesso, avisoOrigem }) {
  const estilo = `
    body { font-family: 'Courier New', monospace; background: #f2ece0; margin: 0; padding: 28px 14px; color: #292524; }
    .ticket { max-width: 420px; margin: 0 auto; background: #fffdf8; border: 1px dashed #b8ab8f; border-radius: 6px; padding: 22px 20px; }
    .emit { text-align: center; font-weight: bold; font-size: 15px; margin-bottom: 2px; }
    .sub { text-align: center; font-size: 11px; color: #78716c; }
    .linha { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 4px 0; }
    .linha .nome { flex: 1; }
    hr { border: none; border-top: 1px dashed #b8ab8f; margin: 12px 0; }
    .total { display: flex; justify-content: space-between; font-weight: bold; font-size: 17px; margin-top: 2px; }
    .rodape { text-align: center; font-size: 10px; color: #a8a29e; margin-top: 14px; word-break: break-all; }
    .aviso { text-align: center; font-size: 10.5px; color: #92400e; background: #fef3c7; border-radius: 8px; padding: 8px 10px; margin-top: 14px; }
    .original { display: block; text-align: center; font-size: 12px; margin-top: 14px; color: #047857; text-decoration: underline; }
  `;
  const linhasItens = (itens || []).map((it) => `
    <div class="linha"><span class="nome">${escaparHtml(it.descricao)}${it.quantidade && it.quantidade !== 1 ? ` (${it.quantidade}x)` : ""}</span><span>${brl(it.valor_total)}</span></div>
  `).join("");
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${escaparHtml(nomeEmit || "Recibo")}</title><style>${estilo}</style></head>
<body><div class="ticket">
  <div class="emit">${escaparHtml(nomeEmit || "Estabelecimento não identificado")}</div>
  ${cnpj ? `<div class="sub">${escaparHtml(cnpj)}</div>` : ""}
  ${dataEmissao ? `<div class="sub">${escaparHtml(dataEmissao)}</div>` : ""}
  <hr>
  ${itens && itens.length ? linhasItens + "<hr>" : ""}
  <div class="total"><span>TOTAL</span><span>${brl(valorTotal)}</span></div>
  ${formaPagamento ? `<div class="sub" style="margin-top:8px;">${escaparHtml(formaPagamento)}</div>` : ""}
  ${chaveAcesso ? `<div class="rodape">Chave: ${escaparHtml(chaveAcesso)}</div>` : ""}
  <div class="aviso">${escaparHtml(avisoOrigem || "Reconstruído a partir do documento original — não é o documento oficial.")}</div>
  <a href="#" id="linkOriginal" class="original">Ver arquivo original</a>
</div></body></html>`;
}

/* Etapa sobre precisão numérica em dinheiro — decisão de escopo, registrada aqui pra quem for
   mexer depois: migrar TUDO pra armazenar em centavos inteiros (em vez de reais como número)
   tocaria praticamente toda soma/multiplicação dos dois arquivos, e exigiria migrar todo o
   histórico já salvo no localStorage de todo mundo que já usa o app — risco de regressão em
   massa, silenciosa, sem jeito fácil de detectar se alguma conta ficou sutilmente errada.
   A correção aqui ataca a MESMA causa raiz (arredondamento de ponto flutuante tipo
   19.99 * 5 = 99.94999999999999, não 99.95) sem migrar nada: converte pra centavos inteiros,
   faz a conta, converte de volta arredondado — o formato salvo continua sendo "reais como
   número" de sempre, só que agora sempre exato até o centavo, nunca com resíduo. Aplicado nos
   pontos de maior valor (subtotal de item, total de sessão no Mercado; saldo de conta no
   Finanças) — não é uma varredura de toda multiplicação/soma dos dois arquivos, que seria um
   projeto à parte, arriscado demais pra fazer de uma vez sem testar cada tela na prática. */
function paraCentavos(valorReais) { return Math.round((valorReais || 0) * 100); }
function deCentavos(centavos) { return centavos / 100; }
function multiplicarValor(valorReais, quantidade) { return deCentavos(Math.round(paraCentavos(valorReais) * quantidade)); }
function somarValores(...valores) { return deCentavos(valores.reduce((acc, v) => acc + paraCentavos(v), 0)); }
function arredondarCentavos(valorReais) { return valorReais == null ? valorReais : deCentavos(paraCentavos(valorReais)); }

/* Seção 24: quando o item teve promoção, o histórico/indicador/tendência/comparação usam o preço
   NORMAL (sem desconto), não o valor efetivamente pago — evita que uma promoção pontual vire
   "o novo normal" e faça o próximo preço cheio parecer caro sem ter ficado. */
function carregarZxing() {
  if (window.ZXing) return Promise.resolve(window.ZXing);
  if (promessaZxingCarregado) return promessaZxingCarregado;
  promessaZxingCarregado = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://unpkg.com/@zxing/library@latest";
    script.onload = () => resolve(window.ZXing);
    script.onerror = () => reject(new Error("Não consegui carregar o leitor — verifique sua internet."));
    document.head.appendChild(script);
  });
  return promessaZxingCarregado;
}
const MAPA_FORMATOS_ZXING = { ean_13: "EAN_13", ean_8: "EAN_8", upc_a: "UPC_A", upc_e: "UPC_E", code_128: "CODE_128", qr_code: "QR_CODE" };
/* Nível 3 (seção 27): reserva pra quando não dá pra usar QR nem XML — só tenta ler o valor TOTAL
   de uma foto do cupom, nunca os itens (OCR de cupom térmico não é confiável o suficiente pra isso).
   Tesseract.js só carrega sob demanda (não pesa o app pra quem nunca usa essa função). */
let promessaPdfJsCarregado = null;
/* Compartilhada entre Finanças (contracheque, extrato bancário) e Mercado (DANFE em PDF, quando
   a nota não veio como XML) — movida pra cá porque deixou de ser algo de um módulo só. */
function carregarPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (promessaPdfJsCarregado) return promessaPdfJsCarregado;
  promessaPdfJsCarregado = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js";
    script.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      resolve(window.pdfjsLib);
    };
    script.onerror = () => reject(new Error("Não consegui carregar o leitor de PDF — verifique sua internet."));
    document.head.appendChild(script);
  });
  return promessaPdfJsCarregado;
}
let promessaTesseractCarregado = null;
function carregarTesseract() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (promessaTesseractCarregado) return promessaTesseractCarregado;
  promessaTesseractCarregado = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://unpkg.com/tesseract.js@5/dist/tesseract.min.js";
    script.onload = () => resolve(window.Tesseract);
    script.onerror = () => reject(new Error("Não consegui carregar a leitura de texto — verifique sua internet."));
    document.head.appendChild(script);
  });
  return promessaTesseractCarregado;
}
/* Achado testando com uma foto de recibo real (maquininha Cielo): esse tipo de comprovante usa
   "VALOR" em vez de "TOTAL" — a versão original só procurava "total" e falhava nesses casos.
   TOTAL continua com prioridade (mais específico, menos ambíguo); VALOR entra como reserva, só
   quando não achou nenhum TOTAL, excluindo variantes que claramente não são o total pago
   (unitário, desconto, troco, parcela) pra não pegar o valor errado numa nota com vários "valor"
   diferentes na mesma página. */
/* Achado testando com uma nota que tem desconto (DANFE): quando existe "Valor Total dos
   Produtos" (bruto) E "Valor a Pagar" (líquido, depois do desconto), a prioridade original só
   por "total" pegava o valor ERRADO (o bruto, sem desconto). "a pagar" é sempre o valor final
   realmente cobrado — checado primeiro, antes de TOTAL. */
function extrairTotalDoTextoOcr(texto) {
  const linhas = texto.split("\n");
  for (const linha of linhas) {
    if (/a\s*pagar/i.test(linha)) {
      const m = linha.match(/(\d{1,4}[.,]\d{2})/);
      if (m) return numDe(m[1]);
    }
  }
  const geralPagar = texto.match(/a\s*pagar\D{0,10}(\d{1,4}[.,]\d{2})/i);
  if (geralPagar) return numDe(geralPagar[1]);

  for (const linha of linhas) {
    if (/total/i.test(linha) && !/sub\s*total/i.test(linha)) {
      const m = linha.match(/(\d{1,4}[.,]\d{2})/);
      if (m) return numDe(m[1]);
    }
  }
  const geralTotal = texto.match(/total\D{0,10}(\d{1,4}[.,]\d{2})/i);
  if (geralTotal) return numDe(geralTotal[1]);

  for (const linha of linhas) {
    if (/valor/i.test(linha) && !/(unit[aá]rio|desconto|troco|parcela)/i.test(linha)) {
      const m = linha.match(/(\d{1,4}[.,]\d{2})/);
      if (m) return numDe(m[1]);
    }
  }
  const geralValor = texto.match(/valor\D{0,10}(\d{1,4}[.,]\d{2})/i);
  return geralValor ? numDe(geralValor[1]) : null;
}

/* =========================================================
   COMPARAÇÃO DE PREÇO POR UNIDADE ENTRE TAMANHOS (seção 22.10, parte 1)
   Normaliza preço pago pra uma unidade-base (kg/l/un) e compara variantes
   que dividem mesmo produto + mesma marca (inclusive "genérico").
========================================================= */
async function baixarOuCompartilharJSON(obj, baseNome, compartilhar) {
  const filename = `${baseNome}-${dataParaArquivo()}.json`;
  const json = JSON.stringify(obj, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  if (compartilhar && navigator.share) {
    try {
      const file = new File([blob], filename, { type: "application/json" });
      if (!navigator.canShare || navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch (e) {}
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* Baixar/compartilhar um arquivo que já está em base64 (documentos anexados no Finanças —
   comprovante, nota, contracheque, fatura). Diferente de baixarOuCompartilharJSON porque o
   conteúdo já existe pronto (data URL), não precisa gerar/serializar nada. */
async function baixarOuCompartilharArquivo(dataUrl, nomeArquivo, mimeType, compartilhar) {
  if (compartilhar && navigator.share) {
    try {
      const resposta = await fetch(dataUrl);
      const blob = await resposta.blob();
      const file = new File([blob], nomeArquivo, { type: mimeType });
      if (!navigator.canShare || navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: nomeArquivo });
        return;
      }
    } catch (e) {}
  }
  const a = document.createElement("a");
  a.href = dataUrl; a.download = nomeArquivo; a.click();
}

function persist(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { console.error("storage error", key, e); return false; }
}

/* Seção 22.9 (item 4.5 do documento): modal de confirmação próprio, com destaque proporcional ao risco */
/* Faz o botão de voltar (físico ou gesto do Android) fechar só a camada atual — modal, formulário
   ou tela de detalhe — em vez de sair do app inteiro. Cada componente que "empilha" uma tela nova
   chama isso: `useFecharComVoltar(true, onFechar)` se for um componente próprio, ou
   `useFecharComVoltar(!!algumEstado, () => setAlgumEstado(null))` se for um bloco condicional
   dentro de uma tela maior. */
function useFecharComVoltar(aberto, onFechar) {
  useEffect(() => {
    if (!aberto) return;
    window.history.pushState({ camadaNossaCasa: true }, "");
    function aoVoltar() { onFechar(); }
    window.addEventListener("popstate", aoVoltar);
    return () => window.removeEventListener("popstate", aoVoltar);
  }, [aberto]);
}

/* Seção 23.3: leitor de código de barras — componente único reutilizado em 4 lugares
   (FormVariante, criação rápida, busca do Adicionar Item, editor pequeno do item).
   Usa o BarcodeDetector nativo do Chrome/Android; se o navegador não suportar, mostra
   aviso e deixa digitar manualmente — nunca trava o fluxo. Só funciona em origem https://
   (ou localhost), por isso dependia da hospedagem estar pronta. */
function IconeCodigoBarras({ size = 18 }) {
  // Ícone simples de código de barras (linhas verticais de espessura variável), substitui o 📷
  const barras = [2, 1, 2, 1, 3, 1, 1, 2, 1, 2, 1, 3, 1, 2];
  const largura = barras.reduce((a, b) => a + b, 0) + barras.length; // espaço entre barras
  let x = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${largura} 20`} aria-hidden="true" style={{ display: "inline-block", verticalAlign: "middle" }}>
      {barras.map((w, i) => {
        const rect = <rect key={i} x={x} y="1" width={w} height="18" fill="currentColor" />;
        x += w + 1;
        return rect;
      })}
    </svg>
  );
}

function ScannerCodigoBarras({ onDetectado, onFechar, formatos = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128"], titulo = "Aponte pro código de barras" }) {
  useFecharComVoltar(true, onFechar);
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const rafRef = useRef(null);
  const zxingRef = useRef(null);
  const [erro, setErro] = useState(null);
  const [suportado, setSuportado] = useState(true);
  const [carregandoReserva, setCarregandoReserva] = useState(false);

  useEffect(() => {
    let cancelado = false;

    async function comBarcodeDetector() {
      let detector;
      try { detector = new window.BarcodeDetector({ formats: formatos }); }
      catch (e) { comZxing(); return; }

      async function escanear() {
        if (cancelado || !videoRef.current) return;
        try {
          const codigos = await detector.detect(videoRef.current);
          if (codigos.length) { onDetectado(codigos[0].rawValue); return; }
        } catch (e) { /* frame inválido nessa passada, tenta de novo */ }
        rafRef.current = requestAnimationFrame(escanear);
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        if (cancelado) { stream.getTracks().forEach((t) => t.stop()); return; }
        streamRef.current = stream;
        if (videoRef.current) { videoRef.current.srcObject = stream; await videoRef.current.play(); }
        escanear();
      } catch (e) { setErro("Não consegui acessar a câmera — verifique a permissão do navegador pra esse site."); }
    }

    /* Reserva pra quando não tem BarcodeDetector (Safari/iPhone — nenhum navegador ali tem essa
       função nativa). Decodifica em JavaScript puro, mais lento mas funciona em qualquer lugar. */
    async function comZxing() {
      setCarregandoReserva(true);
      try {
        const ZXing = await carregarZxing();
        if (cancelado) return;
        setCarregandoReserva(false);
        const formatosZxing = formatos.map((f) => MAPA_FORMATOS_ZXING[f]).filter(Boolean).map((nome) => ZXing.BarcodeFormat[nome]);
        const hints = new Map();
        if (formatosZxing.length) hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formatosZxing);
        const leitor = new ZXing.BrowserMultiFormatReader(hints);
        zxingRef.current = leitor;

        const dispositivos = await leitor.listVideoInputDevices();
        if (cancelado) return;
        const traseira = dispositivos.find((d) => /back|tras|rear|environment/i.test(d.label || ""));
        const deviceId = (traseira || dispositivos[dispositivos.length - 1] || dispositivos[0])?.deviceId;

        leitor.decodeFromVideoDevice(deviceId, videoRef.current, (resultado) => {
          if (cancelado || !resultado) return;
          onDetectado(resultado.getText());
        });
      } catch (e) {
        setCarregandoReserva(false);
        setErro("Não consegui acessar a câmera — verifique a permissão do navegador pra esse site.");
      }
    }

    if (!navigator.mediaDevices?.getUserMedia) { setSuportado(false); return; }
    if ("BarcodeDetector" in window) comBarcodeDetector();
    else comZxing();

    return () => {
      cancelado = true;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
      if (zxingRef.current) { try { zxingRef.current.reset(); } catch (e) {} }
    };
  }, []);

  if (!suportado) {
    return (
      <div className="fixed inset-0 bg-black/80 z-[80] flex items-center justify-center p-4" onClick={onFechar}>
        <div className="bg-white rounded-2xl p-5 max-w-sm" onClick={(e) => e.stopPropagation()}>
          <p className="text-sm text-stone-700 mb-3">Esse navegador não tem acesso à câmera disponível. {formatos.includes("qr_code") ? "Baixe o XML direto do portal da nota." : "Digite o número manualmente."}</p>
          <button onClick={onFechar} className="w-full py-2.5 rounded-lg bg-emerald-700 text-white font-semibold tap-target">Entendi</button>
        </div>
      </div>
    );
  }

  return (
    <div className="fixed inset-0 bg-black z-[80] flex flex-col">
      <div className="flex items-center gap-3 p-4 text-white shrink-0">
        <button onClick={onFechar} aria-label="Fechar leitor" className="tap-target">✕</button>
        <h3 className="text-lg font-bold">{titulo}</h3>
      </div>
      <div className="flex-1 relative overflow-hidden">
        <video ref={videoRef} className="w-full h-full object-cover" playsInline muted />
        <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
          <div className="w-64 h-32 border-2 border-emerald-400 rounded-lg" />
        </div>
        {carregandoReserva && (
          <div className="absolute inset-0 bg-black/70 flex items-center justify-center">
            <div className="text-white text-sm">Carregando leitor...</div>
          </div>
        )}
      </div>
      {erro && <div className="bg-red-600 text-white text-sm p-3 text-center">{erro}</div>}
    </div>
  );
}

/* Teclado numérico reutilizável — usado tanto pra desbloquear quanto pra configurar o PIN do

/* Tela de bloqueio — cobre a tela inteira do Finanças até o PIN certo ser digitado. Reseta
   toda vez que o Finanças é (re)montado (estado local, não persistido) — pedido do usuário:
   "toda vez que abrir", não só uma vez por sessão do navegador. */
function TelaBloqueioPin({ pin, onDesbloqueou, onVoltarHub }) {
  const [digitado, setDigitado] = useState("");
  const [erro, setErro] = useState(false);

  function tocarDigito(d) {
    if (erro || digitado.length >= pin.length) return;
    const novo = digitado + d;
    setDigitado(novo);
    if (novo.length === pin.length) {
      if (novo === pin) setTimeout(onDesbloqueou, 150);
      else { setErro(true); setTimeout(() => { setErro(false); setDigitado(""); }, 500); }
    }
  }

  return (
    <div className="h-screen flex flex-col bg-emerald-900 text-white items-center justify-center max-w-md mx-auto px-6 relative">
      <button onClick={onVoltarHub} className="absolute top-4 left-4 text-white/70 text-sm tap-target">← Voltar</button>
      <div className="text-4xl mb-4">🔒</div>
      <div className="font-semibold mb-6">{erro ? "PIN incorreto" : "Digite o PIN do Finanças"}</div>
      <div className="flex gap-3 mb-8">
        {Array.from({ length: pin.length }).map((_, i) => (
          <div key={i} className={`w-4 h-4 rounded-full border-2 transition-colors ${i < digitado.length ? (erro ? "bg-red-400 border-red-400" : "bg-white border-white") : "border-white/40"}`} />
        ))}
      </div>
      <PainelNumerico onDigito={tocarDigito} onApagar={() => setDigitado((d) => d.slice(0, -1))} />
    </div>
  );
}
/* Configurar/trocar/remover o PIN — pede o PIN atual antes de trocar ou remover (evita que
   alguém com o app já aberto mude o PIN sem saber o antigo). */
function ModalDefinirPin({ modo, pinAtual, onSalvar, onRemover, onFechar }) {
  useFecharComVoltar(true, onFechar);
  const [etapa, setEtapa] = useState(modo === "criar" ? "novo1" : "atual");
  const [valor, setValor] = useState("");
  const [novoPin1, setNovoPin1] = useState(null);
  const [erro, setErro] = useState(null);

  function tocarDigito(d) { if (valor.length < 6) setValor((v) => v + d); }
  function apagar() { setValor((v) => v.slice(0, -1)); }

  function confirmarEtapa() {
    if (valor.length < 4) { setErro("Mínimo 4 dígitos."); return; }
    setErro(null);
    if (etapa === "atual") {
      if (valor !== pinAtual) { setErro("PIN atual incorreto."); setValor(""); return; }
      if (modo === "remover") { onRemover(); return; }
      setEtapa("novo1"); setValor("");
    } else if (etapa === "novo1") {
      setNovoPin1(valor); setEtapa("novo2"); setValor("");
    } else {
      if (valor !== novoPin1) { setErro("Os PINs não bateram — tenta de novo."); setEtapa("novo1"); setNovoPin1(null); setValor(""); return; }
      onSalvar(valor);
    }
  }

  const titulo = etapa === "atual" ? "Digite o PIN atual" : etapa === "novo1" ? "Escolha um PIN novo (4-6 dígitos)" : "Digite de novo pra confirmar";

  return (
    <div className="fixed inset-0 bg-emerald-900 text-white flex flex-col items-center justify-center z-[80] px-6" onClick={(e) => e.stopPropagation()}>
      <button onClick={onFechar} className="absolute top-4 left-4 text-white/70 text-sm tap-target">Cancelar</button>
      <div className="text-4xl mb-4">🔒</div>
      <div className="font-semibold mb-2 text-center">{titulo}</div>
      {erro && <div className="text-red-300 text-sm mb-3">{erro}</div>}
      <div className="flex gap-2 mb-6 font-mono2 text-2xl tracking-widest min-h-[2rem]">{"•".repeat(valor.length)}</div>
      <PainelNumerico onDigito={tocarDigito} onApagar={apagar} />
      <button onClick={confirmarEtapa} className="mt-6 bg-white text-emerald-900 font-semibold px-6 py-2.5 rounded-full tap-target">Continuar</button>
    </div>
  );
}

function ModalConfirmar({ titulo, mensagem, textoConfirmar = "Confirmar", severo = false, onConfirmar, onCancelar }) {

/* TelaConfiguracoesApp — seção 32.x do mapa: tudo que é do app inteiro (versão, backup,
   restaurar, "sobre"), não de um módulo específico, mora aqui — não mais dentro do Mercado.
   Vive no nível do Hub, então nunca tem AppMercado/AppFinancas montado ao lado — lê e escreve
   os dados dos dois módulos direto no localStorage, mesmo princípio já usado na integração
   Mercado→Finanças (Fase 6) e no backup unificado (antes vivia dentro do TelaConfig do Mercado). */
function TelaConfiguracoesApp({ onVoltarHub }) {
  const [buscandoAtualizacao, setBuscandoAtualizacao] = useState(false);
  const [resultadoAtualizacao, setResultadoAtualizacao] = useState(null);
  const [lastBackup, setLastBackup] = useState(() => { try { return localStorage.getItem("nc_lastBackup"); } catch (e) { return null; } });
  const [confirmarReset, setConfirmarReset] = useState(false);
  const diasSemBackup = lastBackup ? Math.floor((Date.now() - new Date(lastBackup).getTime()) / 86400000) : null;

  /* Pedido do usuário: opção de resetar o app inteiro (Mercado + Finanças), com confirmação forte
     — é destrutivo e sem volta, então usa o estilo "severo" do ModalConfirmar (vermelho). */
  function resetarAppTodo() {
    try { localStorage.clear(); } catch (e) {}
    window.location.reload();
  }

  function marcarBackupFeito() {
    const agora = new Date().toISOString();
    try { localStorage.setItem("nc_lastBackup", agora); } catch (e) {}
    setLastBackup(agora);
  }

  function coletarDadosMercadoDoLocalStorage() {
    let catalogo = null, sessoes = [];
    try { const v = localStorage.getItem("nc_catalogo"); catalogo = v ? JSON.parse(v) : null; } catch (e) {}
    try { const v = localStorage.getItem("nc_sessoes"); sessoes = v ? JSON.parse(v) : []; } catch (e) {}
    return { catalogo, sessoes };
  }
  function coletarDadosFinancasDoLocalStorage() {
    const chaves = ["fn_categorias", "fn_contas", "fn_lancamentos", "fn_lancamentosFixos", "fn_lembretes5Dias", "fn_reflexoesMensais", "fn_limiar5Dias", "fn_metas", "fn_documentos", "fn_cartoes", "fn_gruposOrcamento", "fn_rendaManual", "fn_historicoAportes"];
    const dados = {};
    chaves.forEach((chave) => { try { const v = localStorage.getItem(chave); if (v != null) dados[chave] = JSON.parse(v); } catch (e) {} });
    return dados;
  }
  async function exportarBackup(compartilhar) {
    const { catalogo, sessoes } = coletarDadosMercadoDoLocalStorage();
    await baixarOuCompartilharJSON({ ...(catalogo || {}), sessoes, financas: coletarDadosFinancasDoLocalStorage() }, "backup-nossa-casa", compartilhar);
    marcarBackupFeito();
  }
  function restaurarDadosFinancasNoLocalStorage(dadosFinancas) {
    Object.entries(dadosFinancas).forEach(([chave, valorNovo]) => {
      try {
        const atualRaw = localStorage.getItem(chave);
        const atual = atualRaw ? JSON.parse(atualRaw) : null;
        let final;
        if (Array.isArray(valorNovo)) final = upsertBy(Array.isArray(atual) ? atual : [], valorNovo);
        else if (chave === "fn_reflexoesMensais" && valorNovo && typeof valorNovo === "object") final = { ...(atual || {}), ...valorNovo };
        else final = atual != null ? atual : valorNovo;
        localStorage.setItem(chave, JSON.stringify(final));
      } catch (e) {}
    });
  }
  function importar(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const obj = JSON.parse(ev.target.result);
        const { catalogo: catalogoAtual, sessoes: sessoesAtual } = coletarDadosMercadoDoLocalStorage();
        const catalogoNovo = {
          mercados: upsertBy(catalogoAtual?.mercados, obj.mercados), categorias: upsertBy(catalogoAtual?.categorias, obj.categorias),
          produtos: upsertBy(catalogoAtual?.produtos, obj.produtos), marcas: upsertBy(catalogoAtual?.marcas, obj.marcas), variantes: upsertBy(catalogoAtual?.variantes, obj.variantes),
        };
        localStorage.setItem("nc_catalogo", JSON.stringify(catalogoNovo));
        if (obj.sessoes) localStorage.setItem("nc_sessoes", JSON.stringify(upsertBy(sessoesAtual, obj.sessoes)));
        let avisoFinancas = "";
        if (obj.financas) {
          restaurarDadosFinancasNoLocalStorage(obj.financas);
          avisoFinancas = " Dados do Finanças também restaurados.";
        }
        alert("Importado com sucesso!" + avisoFinancas + " Recarregando pra aplicar tudo...");
        setTimeout(() => window.location.reload(), 800);
      } catch (err) { alert("Arquivo inválido: " + err.message); }
    };
    reader.readAsText(file);
    e.target.value = "";
  }
  async function buscarAtualizacaoManual() {
    setBuscandoAtualizacao(true);
    setResultadoAtualizacao(null);
    try {
      const resposta = await fetch("./index.html?t=" + Date.now(), { cache: "no-store" });
      const texto = await resposta.text();
      const encontrado = texto.match(/VERSAO_APP\s*=\s*"([^"]+)"/);
      const versaoServidor = encontrado ? encontrado[1] : null;
      if (versaoServidor && versaoServidor !== VERSAO_APP) {
        setResultadoAtualizacao("Encontrou a versão " + versaoServidor + " — atualizando e recarregando...");
        setTimeout(() => window.location.reload(), 600);
        return;
      }
      setBuscandoAtualizacao(false);
      setResultadoAtualizacao("Você já está na versão mais recente.");
    } catch (e) {
      setBuscandoAtualizacao(false);
      setResultadoAtualizacao("Não consegui verificar agora — confira sua internet.");
    }
  }

  return (
    <div className="h-screen flex flex-col bg-stone-100 max-w-md mx-auto">
      <div className="bg-emerald-800 text-white px-4 py-4 shrink-0 flex items-center gap-3">
        <button onClick={onVoltarHub} aria-label="Voltar" className="text-xl tap-target">←</button>
        <div className="font-bold text-xl">⚙️ Configurações</div>
      </div>
      <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-6">
        <p className="text-xs text-stone-400">Tudo aqui é do app inteiro (Mercado + Finanças juntos). Preferências de cada módulo — categorias, chave de API, orçamento — ficam dentro do próprio módulo, em Config.</p>

        <div className="bg-amber-50 border border-amber-200 text-amber-700 text-xs rounded-xl p-3">
          📌 <b>Guarde este arquivo num lugar fixo</b> (ex: uma pasta "Nossa Casa" nos Arquivos do celular) e crie um atalho direto pra ele — abrir sempre pela lista de "recentes" do Chrome pode gerar um link que para de funcionar se o histórico for limpo.
        </div>

        {diasSemBackup != null && diasSemBackup > 7 && (
          <div className="bg-amber-50 border border-amber-200 text-amber-700 text-sm rounded-xl p-3">⚠️ Faz {diasSemBackup} dias que você não exporta um backup completo. Seus dados vivem só neste navegador — vale exportar.</div>
        )}
        {diasSemBackup == null && (
          <div className="bg-amber-50 border border-amber-200 text-amber-700 text-sm rounded-xl p-3">⚠️ Você ainda não fez nenhum backup completo. Seus dados vivem só neste navegador — se limpar os dados do Chrome, perde tudo.</div>
        )}

        <div className="bg-white border border-stone-200 rounded-xl p-4">
          <div className="font-semibold text-stone-700 mb-1">Backup / nuvem</div>
          <p className="text-xs text-stone-500 mb-3">Exporte o backup completo (Mercado + Finanças, com documentos anexados) e salve numa pasta do Google Drive — assim dá pra importar no outro aparelho quando quiser.</p>
          <div className="grid grid-cols-2 gap-2">
            <button onClick={() => exportarBackup(false)} className="flex items-center justify-center gap-1.5 border border-stone-300 rounded-lg py-2.5 text-sm font-semibold text-stone-600 tap-target">⬇️ Baixar backup</button>
            <button onClick={() => exportarBackup(true)} className="flex items-center justify-center gap-1.5 bg-emerald-700 text-white rounded-lg py-2.5 text-sm font-semibold tap-target">📤 Compartilhar</button>
          </div>
        </div>

        <div className="bg-white border border-stone-200 rounded-xl p-4">
          <div className="font-semibold text-stone-700 mb-1">Importar</div>
          <p className="text-xs text-stone-500 mb-3">Traz um arquivo .json (backup completo, ou só o catálogo do Mercado). Nunca apaga o que já existe, só atualiza/soma.</p>
          <label className="flex items-center justify-center gap-2 border-2 border-dashed border-stone-300 rounded-xl py-4 text-sm text-stone-500 cursor-pointer tap-target">⬆️ Escolher arquivo .json<input type="file" accept="application/json" onChange={importar} className="hidden" /></label>
        </div>

        <div className="bg-white border border-stone-200 rounded-xl p-4">
          <div className="font-semibold text-stone-700 mb-1">Sobre</div>
          <div className="text-xs text-stone-500 font-mono2 mb-2">🧺 Nossa Casa — versão {VERSAO_APP}</div>
          <button onClick={buscarAtualizacaoManual} disabled={buscandoAtualizacao} className="text-xs text-emerald-700 font-semibold border border-emerald-700 rounded-lg px-3 py-2 tap-target">
            {buscandoAtualizacao ? "Buscando…" : "🔄 Buscar atualização agora"}
          </button>
          {resultadoAtualizacao && <p className="text-xs text-stone-500 mt-2">{resultadoAtualizacao}</p>}
        </div>

        <div className="bg-white border border-red-200 rounded-xl p-4">
          <div className="font-semibold text-red-600 mb-1">Zona de risco</div>
          <p className="text-xs text-stone-500 mb-3">Apaga TUDO — Mercado e Finanças juntos (catálogo, compras, lançamentos, metas, documentos). Sem volta. Exporte um backup antes se não tiver certeza.</p>
          <button onClick={() => setConfirmarReset(true)} className="w-full border border-red-300 text-red-600 font-semibold py-2.5 rounded-lg tap-target">🗑️ Resetar o app inteiro</button>
        </div>
      </div>

      {confirmarReset && (
        <ModalConfirmar
          titulo="Resetar o app inteiro"
          mensagem="Isso apaga TODOS os dados do Mercado e do Finanças nesse navegador — catálogo, compras, lançamentos, metas, documentos, tudo. Não tem como desfazer. Tem certeza?"
          textoConfirmar="Sim, apagar tudo"
          severo={true}
          onConfirmar={resetarAppTodo}
          onCancelar={() => setConfirmarReset(false)}
        />
      )}
    </div>
  );
}

class LimiteDeErro extends React.Component {
  constructor(props) { super(props); this.state = { erro: null }; }
  static getDerivedStateFromError(erro) { return { erro }; }
  componentDidCatch(erro, info) { console.error("Erro capturado pelo LimiteDeErro:", erro, info); }
  render() {
    if (this.state.erro) {
      return (
        <div style={{ padding: 20, fontFamily: "monospace", background: "#fff", color: "#111", height: "100vh", overflowY: "auto", boxSizing: "border-box" }}>
          <h2 style={{ color: "#b91c1c", marginBottom: 8 }}>⚠️ Algo quebrou aqui</h2>
          <p style={{ fontWeight: "bold", marginBottom: 12 }}>{String(this.state.erro.message || this.state.erro)}</p>
          <pre style={{ fontSize: 11, whiteSpace: "pre-wrap", background: "#f5f5f4", padding: 10, borderRadius: 8 }}>{this.state.erro.stack}</pre>
          <button onClick={() => window.location.reload()} style={{ marginTop: 16, padding: "10px 16px", background: "#065f46", color: "#fff", border: "none", borderRadius: 8, fontWeight: "bold" }}>Recarregar</button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* App — app-shell enxuto (seção 32 do mapa). Só cuida de: esperar a checagem de atualização,
   guardar a apiKey (compartilhada entre módulos), e decidir se mostra o Hub ou um módulo.
   Cada módulo (AppMercado, e futuramente AppFinancas) cuida do próprio carregamento de dado
   e da própria navegação interna. */
/* Lado do app do compartilhamento nativo (ver service-worker.js) — lê o que ficou pendente no
   IndexedDB ao abrir, e permite limpar depois de usado ou descartado. */
function abrirDbCompartilhamento() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("nossa-casa-compartilhamento", 1);
    req.onupgradeneeded = () => { req.result.createObjectStore("compartilhados", { keyPath: "id" }); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function lerArquivoCompartilhadoPendente() {
  try {
    const db = await abrirDbCompartilhamento();
    return await new Promise((resolve) => {
      const tx = db.transaction("compartilhados", "readonly");
      const req = tx.objectStore("compartilhados").get("pendente");
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}
async function limparArquivoCompartilhadoPendente() {
  try {
    const db = await abrirDbCompartilhamento();
    const tx = db.transaction("compartilhados", "readwrite");
    tx.objectStore("compartilhados").delete("pendente");
  } catch (e) {}
}
function App() {
  const [pronto, setPronto] = useState(false);
  const [abaPrincipal, setAbaPrincipal] = useState("hub");
  const [apiKey, setApiKeyState] = useState("");
  const [arquivoCompartilhado, setArquivoCompartilhado] = useState(null);
  const [sessaoMercadoParaEditar, setSessaoMercadoParaEditar] = useState(null);

  /* Pedido do usuário: o botão/gesto de voltar do celular estava fechando o app inteiro em vez
     de navegar dentro dele — o hook useFecharComVoltar já existia e funcionava bem, mas só era
     usado em modais, nunca nas trocas de tela em si. Aplicado aqui (Hub -> Mercado/Finanças/
     Config) e também dentro de cada módulo (ver aba interna em AppMercado/AppFinancas), pra
     cobrir o app inteiro, não um módulo só. */
  useFecharComVoltar(abaPrincipal !== "hub", () => setAbaPrincipal("hub"));

  useEffect(() => {
    Promise.resolve(window.__promessaVerificacaoAtualizacao).catch(() => {}).then(() => {
      try { setApiKeyState(localStorage.getItem("nc_apiKey") || ""); } catch (e) {}
      setPronto(true);
      lerArquivoCompartilhadoPendente().then((r) => { if (r) setArquivoCompartilhado(r); });
    });
  }, []);

  function setApiKey(k) { setApiKeyState(k); localStorage.setItem("nc_apiKey", k); }
  function descartarArquivoCompartilhado() { limparArquivoCompartilhadoPendente(); setArquivoCompartilhado(null); }

  if (!pronto) return (
    <div className="h-screen flex flex-col items-center justify-center bg-stone-100 text-stone-400 gap-2">
      <div className="text-2xl">🧺</div>
      <div>Verificando atualizações…</div>
      <div className="text-xs font-mono2 text-stone-300">v{VERSAO_APP}</div>
    </div>
  );

  /* Aviso compacto de "recebi um arquivo compartilhado" — fica visível em qualquer tela até
     você usar ou descartar. Mercado processa NF de compra; Finanças guarda no repositório de
     Documentos (escolhe depois onde vincular, ou cria lançamento novo com ele). */
  const avisoCompartilhado = arquivoCompartilhado && (
    <div className="bg-emerald-800 text-white text-xs px-4 py-2 flex items-center justify-between gap-2 shrink-0">
      <span className="truncate">📎 Recebido: {arquivoCompartilhado.nome}</span>
      <div className="flex items-center gap-3 shrink-0">
        {abaPrincipal !== "mercado" && <button onClick={() => setAbaPrincipal("mercado")} className="underline font-semibold tap-target">Mercado</button>}
        {abaPrincipal !== "financas" && <button onClick={() => setAbaPrincipal("financas")} className="underline font-semibold tap-target">Finanças</button>}
        <button onClick={descartarArquivoCompartilhado} aria-label="Descartar arquivo recebido" className="tap-target">✕</button>
      </div>
    </div>
  );

  if (abaPrincipal === "configuracoes") {
    return <LimiteDeErro>{avisoCompartilhado}<TelaConfiguracoesApp onVoltarHub={() => setAbaPrincipal("hub")} /></LimiteDeErro>;
  }

  if (abaPrincipal === "mercado") {
    if (typeof AppMercado === "undefined") return <TelaFalhaDeCarregamento nomeArquivo="mercado.js" onVoltarHub={() => setAbaPrincipal("hub")} />;
    return <LimiteDeErro>{avisoCompartilhado}<AppMercado apiKey={apiKey} setApiKey={setApiKey} onVoltarHub={() => setAbaPrincipal("hub")} onAbrirConfigGeral={() => setAbaPrincipal("config")} arquivoCompartilhado={arquivoCompartilhado} onUsarArquivoCompartilhado={descartarArquivoCompartilhado} sessaoParaEditarExterno={sessaoMercadoParaEditar} onAbriuSessaoExterna={() => setSessaoMercadoParaEditar(null)} /></LimiteDeErro>;
  }

  if (abaPrincipal === "financas") {
    if (typeof AppFinancas === "undefined") return <TelaFalhaDeCarregamento nomeArquivo="financas.js" onVoltarHub={() => setAbaPrincipal("hub")} />;
    return <LimiteDeErro>{avisoCompartilhado}<AppFinancas apiKey={apiKey} setApiKey={setApiKey} onVoltarHub={() => setAbaPrincipal("hub")} onEditarNoMercado={(sessaoId) => { setSessaoMercadoParaEditar(sessaoId); setAbaPrincipal("mercado"); }} arquivoCompartilhado={arquivoCompartilhado} onUsarArquivoCompartilhado={descartarArquivoCompartilhado} /></LimiteDeErro>;
  }

  return <>{avisoCompartilhado}<Hub onEntrar={setAbaPrincipal} /></>;
}
</script>

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
